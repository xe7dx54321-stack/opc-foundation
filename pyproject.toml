[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opc-foundation"
dynamic = ["version"]
description = "Reusable foundation modules for OPC AI product projects"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "PyYAML>=6",
  "httpx>=0.27",
  "trafilatura>=1.8",
  "feedparser>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
opc-foundation = "opc_foundation.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "opc_foundation.version.__version__"}

[tool.ruff]
line-length = 100
