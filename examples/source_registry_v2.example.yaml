registry_id: example_source_registry_v2
version: "0.1"
created_at: "2026-06-17T00:00:00+00:00"
sources:
  - source_id: tavily_search_discovery
    source_name: Tavily Search Discovery
    source_type: search
    source_category: search_discovery
    fetch_method: search_provider
    provider: tavily
    trust_tier: medium
    signal_fit:
      pain_evidence: 0.4
      market_context: 0.7
