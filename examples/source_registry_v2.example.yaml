    source_type: search
    source_category: search_discovery
    fetch_method: search_provider
    provider: brave
    trust_tier: medium
    signal_fit:
      pain_evidence: 0.35
      market_context: 0.65
    expected_signal_types:
      - market_context
      - pain
    requires_key: true
    required_env_vars:
      - BRAVE_SEARCH_API_KEY
    enabled: true
    metadata:
      queries:
        - research automation tools 2026

