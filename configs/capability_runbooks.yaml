# OPC Foundation 能力运行手册配置
#
# 功能说明（小白解读）：
#     这个文件是每个能力的"使用说明书"。
#     它告诉你：这个能力怎么配置、怎么运行、输出在哪、失败了怎么排查。
#
#     核心原则：Foundation provides infrastructure. Business systems keep judgment.
#     这个配置不包含任何投资判断字段。
#
# 更新时间：2026-06-24
# 版本：1.0

version: "1.0"
updated_at: "2026-06-24"

runbooks:
  # ===========================================================================
  # 研究信息采集（8 条能力）
  # ===========================================================================
  - capability_id: research.rss_feed
    title: RSS 订阅采集运行手册
    summary: 从公开的 RSS/Atom 订阅源自动采集文章列表和正文，保存为 Markdown 格式。
    maturity_label: 可试运行
    owner_agent: Research Source Agent
    config_templates:
      - configs/research_sources.example.yaml
      - configs/research_sources.production.example.yaml
    local_config_path: configs/research_sources.production.local.yaml
    primary_output: data/research_archive/index/documents.latest.jsonl
    health_file: data/research_archive/index/source_health.jsonl
    run_log_file: data/research_archive/index/run_log.jsonl
    failed_queue_file: data/research_archive/index/failed_queue.jsonl
    report_dir: data/research_archive/reports
    commands:
      validate_config: python -m opc_foundation.research.cli validate-config --config configs/research_sources.production.local.yaml
      dry_run: python -m opc_foundation.research.cli dry-run --config configs/research_sources.production.local.yaml
      run: python -m opc_foundation.research.cli run --config configs/research_sources.production.local.yaml
      source_health: python -m opc_foundation.research.cli source-health --archive-root data/research_archive
      report: python -m opc_foundation.research.cli report --archive-root data/research_archive
      retry_failed: python -m opc_foundation.research.cli retry-failed --archive-root data/research_archive
    can_do:
      - 订阅各种公开网站的 RSS 源
      - 自动抓取新文章的标题、链接、发布时间、正文
      - 保存为干净的 Markdown 格式 + 元数据
      - 生成 source_health.jsonl 健康状态文件
    cannot_do:
      - 不做投资判断
      - 不做 ticker impact
      - 不生成交易信号
      - 不做文章质量评分
    common_failures:
      - error_type: empty_source
        meaning: 某个 RSS 源没有获取到候选文章
        check: 检查该源的 URL 是否正确、feed 是否还在更新
      - error_type: connector_error
        meaning: 连接器执行失败，无法获取内容
        check: 查看 failed_queue.jsonl 定位失败项，检查网络连接
      - error_type: parse_error
        meaning: RSS feed 解析失败
        check: 检查 feed 格式是否正确，是否需要更新解析逻辑
    troubleshooting_steps:
      - 先运行 validate-config 检查配置文件是否正确
      - 再运行 dry-run 查看候选数量，确认源是否正常
      - 查看 source_health.jsonl 判断每个源的状态
      - 查看 failed_queue.jsonl 定位失败项
      - 查看 reports 目录中的最近报告
      - 如仍无法解决，查看 docs/research_source_foundation.md 文档
    docs:
      - docs/research_source_foundation.md
      - docs/research_source_production_readiness.md
      - docs/research_source_live_smoke_registry.md

  - capability_id: research.wechat_archive
    title: 公众号文章运行手册
    summary: 读取已经归档好的微信公众号文章索引，纳入统一的研究信息库。
    maturity_label: 可试运行
    owner_agent: Research Source Agent
    config_templates:
      - configs/research_sources.example.yaml
      - configs/research_sources.production.example.yaml
    local_config_path: configs/research_sources.production.local.yaml
    primary_output: data/research_archive/index/documents.latest.jsonl
    health_file: data/research_archive/index/source_health.jsonl
    run_log_file: data/research_archive/index/run_log.jsonl
    failed_queue_file: data/research_archive/index/failed_queue.jsonl
    report_dir: data/research_archive/reports
    commands:
      validate_config: python -m opc_foundation.research.cli validate-config --config configs/research_sources.production.local.yaml
      dry_run: python -m opc_foundation.research.cli dry-run --config configs/research_sources.production.local.yaml --source-type wechat_archive
      run: python -m opc_foundation.research.cli run --config configs/research_sources.production.local.yaml --source-type wechat_archive
      source_health: python -m opc_foundation.research.cli source-health --archive-root data/research_archive
      report: python -m opc_foundation.research.cli report --archive-root data/research_archive
    can_do:
      - 消费微信模块已经归档好的公众号文章
      - 不直接抓取微信，只读取已归档的元数据
      - 和 RSS 采集输出格式一致，方便统一处理
    cannot_do:
      - 不直接抓取微信公众号
      - 不做投资判断
      - 不做文章质量评分
    common_failures:
      - error_type: missing_archive
        meaning: 微信归档文件不存在或为空
        check: 检查 wechat_archive 模块是否已运行，data/wechat_archive 目录是否存在
      - error_type: parse_error
        meaning: 微信归档格式解析失败
        check: 检查归档文件格式是否正确
    troubleshooting_steps:
      - 确认 wechat_archive 模块已运行并生成归档文件
      - 查看 source_health.jsonl 判断源状态
      - 查看 failed_queue.jsonl 定位失败项
      - 查看 docs/wechat_archive_consumer_contract.md 了解消费协议
    docs:
      - docs/research_source_foundation.md
      - docs/wechat_archive_consumer_contract.md

  - capability_id: research.manual_url
