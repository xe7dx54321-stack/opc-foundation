  # ===========================================================================
  # 官方公告采集（3 条能力）
  # ===========================================================================
  - capability_id: official_filing.sec_edgar
    title: SEC EDGAR 公告运行手册
    summary: 从美国 SEC EDGAR 系统采集美股上市公司的公开公告，如 8-K、10-K、10-Q。
    maturity_label: 可试运行
    owner_agent: Official Filing Agent
    config_templates:
      - configs/official_filings.example.yaml
      - configs/official_filings.production.example.yaml
    local_config_path: configs/official_filings.production.local.yaml
    primary_output: data/official_filings/index/filings.latest.jsonl
    health_file: data/official_filings/index/source_health.jsonl
    run_log_file: data/official_filings/index/run_log.jsonl
    failed_queue_file: data/official_filings/index/failed_queue.jsonl
    report_dir: data/official_filings/reports
    commands:
      validate_config: python -m opc_foundation.official_filings.cli validate-config --config configs/official_filings.production.local.yaml
      dry_run: python -m opc_foundation.official_filings.cli dry-run --config configs/official_filings.production.local.yaml
      run: python -m opc_foundation.official_filings.cli run --config configs/official_filings.production.local.yaml
      source_health: python -m opc_foundation.official_filings.cli source-health --archive-root data/official_filings
      report: python -m opc_foundation.official_filings.cli report --archive-root data/official_filings
      retry_failed: python -m opc_foundation.official_filings.cli retry-failed --archive-root data/official_filings
    can_do:
      - 抓取 8-K（重大事件）、10-K（年报）、10-Q（季报）等
      - 提取公告标题、发布日期、公司 CIK、文件链接
      - 支持按公司和类型筛选
      - 生成 filings.latest.jsonl 索引文件
    cannot_do:
      - 不做投资判断
      - 不做 ticker impact
      - 不生成交易信号
      - 不分析公告内容
    common_failures:
      - error_type: empty_source
        meaning: 没有获取到候选披露
        check: 检查 CIK、时间范围、source 配置
      - error_type: connector_error
        meaning: SEC EDGAR 连接失败
        check: 检查网络连接、SEC API 是否可用
      - error_type: rate_limit
        meaning: SEC API 请求频率限制
        check: 检查请求频率，考虑增加间隔时间
    troubleshooting_steps:
      - 先运行 validate-config 检查配置文件是否正确
      - 再运行 dry-run 查看候选数量
      - 查看 source_health.jsonl 判断 source 状态
      - 查看 failed_queue.jsonl 定位失败项
      - 查看 reports 目录中的最近报告
      - 如仍无法解决，查看 docs/official_filing_foundation.md 文档
