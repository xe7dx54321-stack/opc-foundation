  do_not_modify_current_trial_v2_allowlist: true
  do_not_modify_trae_scheduling: true
  do_not_configure_production: true
  no_browser_runtime: true
  no_new_sources: true
  no_data_commit: true

network:
  stable_network_required: true
  allow_proxy: true
  timeout_seconds: 20
