  - markets_insider
  - china_fund_news
  - wind_public
  - goldman_sachs_insights
  - business_insider
  - cls_cn
  - zhitong_caijing

new_candidates:
  - source_id: gelonghui
    source_name: "格隆汇"
    expected_status: content_ready
    min_valid_candidates: 2
    min_relevant_candidates: 2
    min_dated_candidates: 2
    min_content_score: 70
    rounds: 3
    scheduling_allowed_now: false
    ready_for_expansion_evaluation: true
    repair_phase: "M3C-5B1.1a"
    repair_score: 100

candidate_allowlist:
  - barclays_our_insights
  - markets_insider
  - china_fund_news
  - wind_public
  - goldman_sachs_insights
  - business_insider
  - cls_cn
  - zhitong_caijing
