  description: "Validate gelonghui as 9th source for 8->9 expansion"
  production_enabled: false
  affects_current_trial_v2_allowlist: false
  affects_trae_scheduling: false
  expansion_candidate_only: true
  base_trial_v2_content_ready_count: 8
  new_candidate_count: 1
