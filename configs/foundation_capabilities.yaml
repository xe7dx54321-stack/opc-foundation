# OPC Foundation Capability Registry
#
# 功能说明（小白解读）：
#     这个文件是 opc-foundation 的能力注册表。
#     它声明了项目里有哪些"能力"（capability），每条能力属于哪条"主线"（track），
#     成熟度如何，输出文件在哪，健康检查文件在哪。
#
#     核心原则：Foundation provides infrastructure. Business systems keep judgment.
#     这个配置不包含任何投资判断字段。
#
# 更新时间：2026-06-24
# 版本：1.0

version: "1.0"
updated_at: "2026-06-24"

# ===========================================================================
# tracks: 能力主线（4 条）
# ===========================================================================
tracks:
  - track_id: research
    name: Research Source Foundation
    status: production_trial_ready
    description: "公开研究信息源归档基础设施：RSS、微信公众号归档、手工 URL、官方研究页面、播客 transcript、会议 transcript、分析师评级变动、媒体引用。只采集公开 metadata，不做投资判断。"

  - track_id: official_filing
    name: Official Filing Foundation
    status: production_trial_ready
    description: "官方公告归档基础设施：SEC EDGAR、巨潮资讯（CNINFO）、港交所（HKEX）。只归档公开公告原文和 metadata，不做投资判断。"

  - track_id: document_extraction
    name: Document Extraction Foundation
    status: production_trial_ready
    description: "文档抽取基础设施：PDF、HTML、TXT、Markdown。把各种格式的文档抽成干净的文本和 metadata，不做投资判断。"

  - track_id: runtime
    name: Shared Runtime Foundation
    status: mvp_ready
    description: "共享运行时基础设施：archive 路径、JSONL 读写、失败队列、运行日志、健康状态。所有 foundation 模块复用这一层。"

# ===========================================================================
# capabilities: 能力列表（20 条）
# ===========================================================================
capabilities:

  # -------------------------------------------------------------------------
  # Research Source Foundation（8 条能力）
  # -------------------------------------------------------------------------
  - capability_id: research.rss_feed
    name: RSS Feed
    track: research
    category: source
    maturity_status: production_trial_ready
    description: "从公开 RSS/Atom feed 采集研究文章，归档为 markdown + metadata。"
    input_type: rss_feed
    primary_output: data/research_archive/index/documents.latest.jsonl
    health_file: data/research_archive/index/source_health.jsonl
    run_log_file: data/research_archive/index/run_log.jsonl
    failed_queue_file: data/research_archive/index/failed_queue.jsonl
    docs:
      - docs/research_source_foundation.md
      - docs/research_source_production_readiness.md
      - docs/research_source_live_smoke_registry.md

  - capability_id: research.wechat_archive
    name: WeChat Archive
