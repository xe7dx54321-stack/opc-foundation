# OPC Foundation Capability Registry
#
# 功能说明（小白解读）：
#     这个文件是 opc-foundation 的能力注册表。
#     它声明了项目里有哪些"能力"（capability），每条能力属于哪条"主线"（track），
#     成熟度如何，输出文件在哪，健康检查文件在哪。
#
#     核心原则：Foundation provides infrastructure. Business systems keep judgment.
#     这个配置不包含任何投资判断字段。
#
# 更新时间：2026-06-24
# 版本：1.1

version: "1.1"
updated_at: "2026-06-24"

# ===========================================================================
# tracks: 能力主线（4 条）
# ===========================================================================
tracks:
  - track_id: research
    name: 研究信息采集
    name_en: Research Source Foundation
    status: production_trial_ready
    description: "采集公开的研究信息源——包括 RSS 订阅、公众号文章、官方研报、播客、会议纪要、分析师观点、媒体报道等。只采集公开信息，不做投资判断。"

  - track_id: official_filing
    name: 官方公告采集
    name_en: Official Filing Foundation
    status: production_trial_ready
    description: "采集各国官方披露的上市公司公告——美股 SEC、A 股巨潮资讯、港股港交所。只归档公开公告原文，不做投资判断。"

  - track_id: document_extraction
    name: 文档内容抽取
    name_en: Document Extraction Foundation
    status: production_trial_ready
    description: "把各种格式的文档（PDF/HTML/TXT/Markdown）抽成干净的文本和元数据。OCR 默认关闭，不做图片文字识别。"

  - track_id: runtime
    name: 共享运行工具
    name_en: Shared Runtime Foundation
    status: mvp_ready
    description: "所有模块共用的底层工具——路径管理、JSONL 读写、失败队列、运行日志、健康状态。"

