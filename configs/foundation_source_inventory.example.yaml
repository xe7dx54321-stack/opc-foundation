# OPC Foundation Source Inventory
# 用于登记后续准备上线的真实信息源
# 本阶段只做配置登记，不真实访问网站，不启动采集

version: 1
updated_at: "2026-06-25"

# ============================================
# Source Groups - 信息源分组
# ============================================
source_groups:
  - group_id: official_public_research
    group_name: 投行官方公开研究
    description: 投行官网公开研究、公开报告、公开观点入口
    default_activation_priority: S
    default_automation_mode: scheduled
    default_schedule_profile: medium_daily

  - group_id: official_podcast_transcript
    group_name: 投行官方播客/文字稿
    description: 投行官方播客节目及其文字稿版本
    default_activation_priority: S
    default_automation_mode: scheduled
    default_schedule_profile: medium_daily

  - group_id: bank_conference_transcripts
    group_name: 投行会议纪要/公司IR
    description: 投行主办会议的纪要、上市公司投资者关系页面
    default_activation_priority: S
    default_automation_mode: scheduled
    default_schedule_profile: low_daily

  - group_id: media_research_mentions
    group_name: 媒体研报二次引用
    description: 主流财经媒体对投行研报的二次引用和报道
    default_activation_priority: A
    default_automation_mode: scheduled
    default_schedule_profile: high_daily

  - group_id: analyst_actions
    group_name: 分析师评级/目标价变动
    description: 分析师评级变动、目标价调整等动作信息（仅登记metadata，不做投资判断）
    default_activation_priority: A
    default_automation_mode: scheduled
    default_schedule_profile: high_daily

  - group_id: chinese_rebroadcast
    group_name: 中文财经二次传播
    description: 中文财经媒体/自媒体对海外研报观点的二次传播
    default_activation_priority: B
    default_automation_mode: scheduled
    default_schedule_profile: medium_daily

  - group_id: blocked_high_risk_sources
    group_name: 高风险禁止源
    description: 明确禁止接入的高风险信息源
    default_activation_priority: blocked
    default_automation_mode: do_not_ingest
    default_schedule_profile: blocked

  - group_id: search_providers
    group_name: 搜索补充源
    description: 各类搜索API/provider，用于补充查询，不进入默认高频调度
    default_activation_priority: supplement
    default_automation_mode: on_demand
    default_schedule_profile: on_demand

  - group_id: community_dev_signals
    group_name: 社区/开发者信号
    description: GitHub Issues、Hacker News等技术社区信号，供Demand Radar或指定项目调用
    default_activation_priority: supplement
    default_automation_mode: dormant
    default_schedule_profile: on_demand

