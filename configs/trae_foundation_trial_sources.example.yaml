# TRAE Foundation Trial Sources Config
# M3C-2D-URLFix Trial Run Configuration
# Trial-only config: NOT final production. 15 verified sources (fixed 2 GS URLs, removed 1 MS IR).
# This config is used by the trial run scripts and CLI.
---
version: 1
trial_mode: true
production_mode: false
updated_at: "2026-06-26"
description: "M3C-2D-URLFix trial run for 15 verified sources. 2 GS URLs fixed (200 OK), 1 MS IR removed (403). Trial-only, not final production."

# Archive root for trial outputs
# 重要：只写入 data/foundation_trial/，不写入 data/research/
archive_root: "data/foundation_trial"

# Trial metadata
trial:
  name: "foundation_m3c_2d_trial"
  based_on: "M3C-2C trae_trial_ready bucket + M3C-2D-URLFix URL corrections"
  source_count: 15
  purpose: "Verify 16 live-smoke OK sources can be scheduled in TRAE"
  not_for_production: true

# Archive settings for trial run
archive:
  # Trial run 仅提取元数据（标题、链接、发布时间），不下载全文
  extract_full_text: false
  max_items_per_source: 10
  max_age_days: 3

# Proxy settings (CLI overrides / env vars override this)
proxy:
  enabled: false
  # proxy_url 不写死在配置里，由命令行参数传入

# Source list: 仅包含 16 个 trial ready 源
# 全部来自 foundation_source_inventory.example.yaml（source_id 保持一致）
sources:
  # ============================================================
  # 投行官方公开研究 (5)
  # ============================================================
  - source_id: "goldman_sachs_research"
    source_type: "official_public_research"
    source_name: "Goldman Sachs Research"
    feed_url: "https://www.goldmansachs.com/insights"
    base_url: "https://www.goldmansachs.com/insights/"
    enabled: true
    tags: ["goldman", "research", "bank", "official"]
    extraction:
      max_items: 10
      extract_full_text: false
      priority: "S"
      description: "Goldman Sachs 官方研究报告"

  - source_id: "goldman_sachs_reports"
    source_type: "official_public_research"
    source_name: "Goldman Sachs Reports"
    feed_url: "https://www.goldmansachs.com/insights/reports"
    base_url: "https://www.goldmansachs.com/insights/reports/"
    enabled: true
    tags: ["goldman", "reports", "bank", "official"]
    extraction:
      max_items: 10
      extract_full_text: false
      priority: "S"
      description: "Goldman Sachs 报告列表"

  - source_id: "goldman_sachs_top_of_mind"
    source_type: "official_public_research"
    source_name: "Goldman Sachs Top of Mind"
    feed_url: "https://www.goldmansachs.com/insights/top-of-mind/"
    base_url: "https://www.goldmansachs.com/insights/top-of-mind/"
    enabled: true
    tags: ["goldman", "top-of-mind", "bank", "official"]
    extraction:
      max_items: 5
      extract_full_text: false
      priority: "S"
      description: "Goldman Sachs Top of Mind 专题"

  - source_id: "goldman_sachs_insights"
    source_type: "official_public_research"
    source_name: "Goldman Sachs Insights"
    feed_url: "https://www.goldmansachs.com/insights/"
    base_url: "https://www.goldmansachs.com/insights/"
    enabled: true
    tags: ["goldman", "insights", "bank", "official"]
    extraction:
      max_items: 10
      extract_full_text: false
      priority: "S"
      description: "Goldman Sachs Insights 总览页"

  - source_id: "barclays_our_insights"
    source_type: "official_public_research"
    source_name: "Barclays Our Insights"
    feed_url: "https://www.barclays.com/insights"
    base_url: "https://home.barclays/"
