  - source_id: "local_document_sample"
    source_name: "Local Document Sample"
    source_type: "local_document"
    url: "./data/research_archive/local_documents"
    enabled: false
    legal_profile: "user_provided"
    fetch_profile: "local_index"
    extraction_profile: "metadata_passthrough"
    update_frequency: "weekly"
    priority: "low"
    tags: ["local", "user_provided"]
    notes: "Phase 1 未实现，预留 source_type"
