# OPC Foundation Capability Runtime Bindings
#
# 功能说明（小白解读）：
#     这个文件告诉 Dashboard 每个 capability_id 应该从哪些真实运行文件中读取数据。
#     比如 research.rss_feed 这个能力，它的健康数据存在哪里，运行日志存在哪里。
#
#     为什么需要这个文件？
#     因为 foundation_capabilities.yaml 里的 health_file 是简化配置，
#     而实际运行时，同一个 archive_root 下可能有多个 source_type，
#     需要更精细的匹配规则来确定哪些记录属于哪个 capability。
#
#     匹配规则（优先级从高到低）：
#     1. 先按 source_types 匹配（最常用）
#     2. 如果 source_ids 非空，再按 source_id 精确匹配
#     3. document_extraction 类能力可按 file_extensions 辅助匹配
#
#     注意：
#     - capability_id 必须存在于 foundation_capabilities.yaml
#     - 没有真实运行文件的能力可以不绑定，Dashboard 显示"未配置"或"未知"
#     - runtime 工具类能力一般不需要绑定
#     - 本地绑定请用 capability_runtime_bindings.local.yaml（已加入 .gitignore）
#
# 更新时间：2026-06-25
# 版本：1.0

version: "1.0"
updated_at: "2026-06-25"

# ===========================================================================
# bindings: 能力与运行时数据的绑定关系
